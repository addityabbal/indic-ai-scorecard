name: monthly-run

# Nightly on days 1-7 of each month (01:47 IST). Each night runs until a free-tier daily
# limit or the neuron budget is hit, then stops; the next night resumes from the cache.
on:
  schedule:
    - cron: "17 20 1-7 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monthly-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Decrypt the hidden set (when it exists)
        if: ${{ hashFiles('cases/hidden.jsonl.age') != '' }}
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          sudo apt-get install -y age
          echo "$AGE_KEY" > key.txt && age -d -i key.txt cases/hidden.jsonl.age > cases/hidden.jsonl && rm key.txt
      - name: Collect answers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python -m harness.run --models enabled --cases all --resume --stop-on-daily-limit --neuron-budget 5000
      - name: Judge and score
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python -m scoring.judge --resume --stop-on-daily-limit --neuron-budget 3000
          python -m scoring.calibrate
          python -m scoring.aggregate
      - name: Never commit the hidden set
        run: rm -f cases/hidden.jsonl key.txt results/*/hidden_answers.local.jsonl
      - name: Commit results
        run: |
          git config user.name "scorecard-bot"
          git config user.email "scorecard-bot@users.noreply.github.com"
          git add results/
          git commit -m "run: $(date -u +%F)" || echo "no changes"
          git push
