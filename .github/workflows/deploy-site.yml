name: deploy-site

# Redeploys the leaderboard when results or the site change. Needs the CF_API_TOKEN secret
# (Account · Workers Scripts · Edit, Zone · Workers Routes · Edit) and CF_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["results/latest.json", "site/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/prepare_site.py
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CF_API_TOKEN secret not set; skipping deploy (deploy locally with npx wrangler deploy)."
            exit 0
          fi
          npx --yes wrangler@4 deploy
