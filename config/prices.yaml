  "@cf/mistralai/mistral-small-3.1-24b-instruct": { in: 0.351, out: 0.555 }
  "@cf/openai/gpt-oss-20b": { in: 0.200, out: 0.300 }
  "@cf/openai/gpt-oss-120b": { in: 0.350, out: 0.750 }

