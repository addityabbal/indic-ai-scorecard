# Models under test. Model IDs change often: each run records the exact ID it called.
# provider: groq | gemini | sarvam | openrouter | workers-ai
# A model runs only if enabled AND its provider's key is present (see harness/providers.py).
# is_judge: the AI judge. Shown on the leaderboard but not ranked (judges favour their own answers).
# rpm: requests per minute to stay under (free tiers). max_tokens covers hidden reasoning tokens too.

defaults:
  temperature: 0
  max_tokens: 1500

models:
  # ---- Cloudflare Workers AI (free 10,000 neurons/day, shared with other demos on the account)
  - id: llama-3.3-70b
    provider: workers-ai
    model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    maker: Meta
    enabled: true
    rpm: 60
  - id: llama-4-scout
    provider: workers-ai
    model: "@cf/meta/llama-4-scout-17b-16e-instruct"
    maker: Meta
    enabled: true
    rpm: 60
  - id: mistral-small-3.1
    provider: workers-ai
    model: "@cf/mistralai/mistral-small-3.1-24b-instruct"
    maker: Mistral AI
    enabled: true
    rpm: 60
  - id: gpt-oss-20b
    provider: workers-ai
    model: "@cf/openai/gpt-oss-20b"
    maker: OpenAI
    enabled: true
    rpm: 60
    reasoning_effort: low
  - id: qwen3.8-27b
    provider: workers-ai
    model: "@cf/qwen/qwen3.8-27b"
    maker: Alibaba (Qwen)
    enabled: true
    rpm: 60
  - id: glm-4.7-flash
    provider: workers-ai
    model: "@cf/zai-org/glm-4.7-flash"
    maker: Z.ai
    enabled: true
    rpm: 60
  - id: gemma-4-26b
    provider: workers-ai
    model: "@cf/google/gemma-4-26b-a4b-it"
    maker: Google
    enabled: true
    is_judge: true      # pilot judge until a Groq key is added (plan: large open model on Groq)
    rpm: 60
    max_tokens: 3000    # it reasons before grading; 1,500 sometimes cut the JSON off

  # ---- Groq (free tier; add GROQ_API_KEY). Check current IDs at console.groq.com/docs/models
  - id: groq-llama-3.3-70b
    provider: groq
    model: llama-3.3-70b-versatile
    maker: Meta (via Groq)
    enabled: true
    rpm: 25
  - id: groq-llama-3.1-8b
    provider: groq
    model: llama-3.1-8b-instant
    maker: Meta (via Groq)
    enabled: true
    rpm: 25
  - id: groq-gpt-oss-20b
    provider: groq
    model: openai/gpt-oss-20b
    maker: OpenAI (via Groq)
    enabled: true
    rpm: 25

  # ---- Google AI Studio (free tier trains on prompts: public cases only). Add GEMINI_API_KEY.
  - id: gemini-flash-lite
    provider: gemini
    model: gemini-flash-lite-latest
    maker: Google
    enabled: true
    rpm: 10
    public_cases_only: true

  # ---- Sarvam AI, built in India (₹100 signup credit). Add SARVAM_API_KEY. Check model ID in Sarvam docs.
  - id: sarvam
    provider: sarvam
    model: sarvam-m
    maker: Sarvam AI (India)
    enabled: true
    rpm: 20

  # ---- OpenRouter :free models (optional, 50 requests/day). Add OPENROUTER_API_KEY.
  - id: openrouter-free
    provider: openrouter
    model: "meta-llama/llama-3.3-70b-instruct:free"
    maker: Meta (via OpenRouter)
    enabled: false
    rpm: 15
